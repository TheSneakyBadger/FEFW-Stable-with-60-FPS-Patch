# SPDX-License-Identifier: GPL-3.0-or-later
# Fortune's Eden: Linux test build (AppImage plus a portable "user" folder). Follows Eden-CI's
# AppImage recipe (Arch container, quick-sharun). The Windows releases are built locally.

name: Linux build

on:
  push:
    branches: [linux-build]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
      options: --privileged --device /dev/fuse
    defaults:
      run:
        shell: bash
    env:
      CCACHE_MAXSIZE: 2G
    steps:
      # The container has no git; without it the checkout is a plain download.
      - name: Install git
        run: |
          for _ in 1 2 3; do pacman -Syu --noconfirm --needed git && break; done

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: |
          git config --global --add safe.directory '*'
          echo "CCACHE_DIR=$PWD/.ccache" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          for _ in 1 2 3; do
            if pacman -Syu --noconfirm --needed --overwrite '*' \
                base-devel boost boost-libs catch2 ccache cmake curl enet ffnvcodec-headers fmt \
                gamemode git glslang jq libva libvdpau libvpx libxcursor libxss nasm ninja \
                nlohmann-json patchelf pulseaudio pulseaudio-alsa python-requests qt6-base \
                qt6-charts qt6-tools qt6-wayland spirv-headers spirv-tools unzip \
                vulkan-headers vulkan-mesa-layers vulkan-utility-libraries wget xcb-util-cursor \
                xcb-util-image xcb-util-renderutil xcb-util-wm zip; then break; fi
          done
          wget -q --retry-connrefused --tries=30 \
            https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/refs/heads/main/useful-tools/get-debloated-pkgs.sh
          chmod +x get-debloated-pkgs.sh
          ./get-debloated-pkgs.sh --add-mesa qt6-base-mini libxml2-mini opus-nano

      - name: CPM cache
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-linux-${{ hashFiles('**/cpmfile.json') }}
          restore-keys: cpm-linux-

      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_QT=ON -DYUZU_USE_BUNDLED_QT=OFF -DENABLE_QT_TRANSLATION=OFF \
            -DENABLE_UPDATE_CHECKER=OFF -DENABLE_WEB_SERVICE=OFF -DENABLE_LTO=OFF \
            -DYUZU_USE_BUNDLED_FFMPEG=ON -DYUZU_USE_BUNDLED_SIRIT=ON \
            -DYUZU_USE_BUNDLED_OPENSSL=ON -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_DISABLE_LLVM=ON -DYUZU_CMD=OFF -DYUZU_ROOM_STANDALONE=OFF \
            -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF -DDYNARMIC_TESTS=OFF -DENABLE_WERROR=OFF \
            -DUSE_DISCORD_PRESENCE=OFF

      - name: Build
        run: |
          cmake --build build --target yuzu
          ccache -s

      - name: Package
        run: |
          export ICON="$PWD/dist/dev.eden_emu.eden.svg"
          export DESKTOP="$PWD/dist/dev.eden_emu.eden.desktop"
          # No OPTIMIZE_LAUNCH: its start-up profiling needs a virtual X server (xvfb).
          export DEPLOY_OPENGL=1 DEPLOY_VULKAN=1
          export ADD_HOOKS="wayland-is-broken.hook"
          export OUTPATH="$PWD/appimage"
          export OUTNAME="Fortunes-Eden.AppImage"
          curl -fL --retry 30 -o quick-sharun \
            https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/refs/heads/main/useful-tools/quick-sharun.sh
          chmod a+x quick-sharun
          ./quick-sharun build/bin/eden
          ./quick-sharun --make-appimage
          version=$(sed -n 's/.*FEFW_VERSION_STRING "\(v[0-9.]*\)".*/\1/p' src/common/fefw_version.h | head -n 1)
          test -n "$version" || { echo "No version in src/common/fefw_version.h"; exit 1; }
          name="Fortunes-Eden-${version}-linux-x86_64-${GITHUB_SHA::7}"
          mkdir -p "artifacts/$name"
          cp -r dist/fortunes-eden-linux/. "artifacts/$name/"
          sed -i "s/@VERSION@/${version}/" "artifacts/$name/README.txt"
          cp appimage/Fortunes-Eden.AppImage "artifacts/$name/"
          chmod +x "artifacts/$name/Fortunes-Eden.AppImage" "artifacts/$name/start-fortunes-eden.sh"
          cp LICENSE.txt "artifacts/$name/LICENSE"
          mkdir -p "artifacts/$name/licenses/dav1d"
          cp externals/dav1d/COPYING "artifacts/$name/licenses/dav1d/COPYING.txt"
          if [ -f externals/FidelityFX-SDK/LICENSE.txt ]; then
            mkdir -p "artifacts/$name/licenses/amd-fidelityfx-sdk"
            cp externals/FidelityFX-SDK/LICENSE.txt "artifacts/$name/licenses/amd-fidelityfx-sdk/"
          fi
          # tar keeps the executable bits (the artifact zip would drop them).
          tar -C artifacts -czf "$name.tar.gz" "$name"
          mkdir -p out && mv "$name.tar.gz" out/
          ls -la out "artifacts/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: fortunes-eden-linux-x86_64
          path: out/
          retention-days: 30

      # A plain download link for testers (artifacts need a GitHub login): the .tar.gz goes on
      # the test-builds branch, replacing the previous Linux build there.
      - name: Publish to test-builds
        run: |
          file=$(ls out/*.tar.gz)
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin test-builds
          git worktree add -B test-builds ../test-builds FETCH_HEAD
          # One fixed name, so links to the newest Linux build keep working.
          rm -f ../test-builds/Fortunes-Eden-*linux*.tar.gz
          cp "$file" ../test-builds/Fortunes-Eden-linux-x86_64.tar.gz
          cd ../test-builds
          git add -A
          git commit -m "Linux test build $(basename "$file") from ${GITHUB_SHA::7}"
          git push origin test-builds
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/raw/test-builds/Fortunes-Eden-linux-x86_64.tar.gz"
